[package]
name        = "ether-receiver"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Reference consumer: verifies native Ethereum account balance using the Mosoo attestation module"

[dependencies]
mosoo-core       = { path = "../../mosoo-core" }
alloy-primitives = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
thiserror        = { workspace = true }

[features]
default = []
test-harness = []

[dev-dependencies]
alloy-rlp        = { workspace = true }
mosoo-core       = { path = "../../mosoo-core", features = ["test-harness"] }
