[package]
name        = "erc20-receiver"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Reference consumer: verifies an Ethereum ERC-20 transfer using the Mosoo attestation module"

[dependencies]
mosoo-core = { path = "../../mosoo-core" }
serde      = { workspace = true }
