[package]
name        = "mosoo-daemon"
version     = "0.4.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Permissionless daemon that submits Ethereum consensus updates to the Mosoo LEZ instance"

[[bin]]
name = "mosoo-daemon"
path = "src/main.rs"

[dependencies]
mosoo-core = { path = "../mosoo-core" }
tokio      = { workspace = true }
clap       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
rand       = { workspace = true }
alloy      = { workspace = true }
hex        = { workspace = true }
sha2       = { workspace = true }
reqwest    = { version = "0.12", features = ["json"] }
