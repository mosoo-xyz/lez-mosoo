[package]
name        = "mosoo-core"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Shared types and cryptographic helpers for the Mosoo Ethereum attestation module"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
hex         = { workspace = true }
sha2        = { workspace = true }
thiserror   = { workspace = true }
alloy-primitives = { workspace = true }
alloy-trie       = { workspace = true }
alloy-rlp        = { workspace = true }
nybbles          = { workspace = true }

# blst is the optimized BLS12-381 pairing library (Supranational).
# On host architectures it utilizes hand-optimized assembly (ADX/BMI2);
# inside the RISC0 zkVM guest it compiles via the portable C engine.
blst = { workspace = true }

[dev-dependencies]
erc20-receiver = { path = "../consumers/erc20-receiver" }
ether-receiver = { path = "../consumers/ether-receiver" }
