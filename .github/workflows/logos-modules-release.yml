name: Logos Module Packaging & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run verification mode (do not fail if upstream module catalog is unreleased)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  package-and-release:
    name: Package SPEL Module for Logos Core Catalog
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Host Release Packages (Core, CLI, Host Guest Harness)
        # Note: For deterministic RISC Zero zkVM ELF compilation (`riscv32im-risc0-zkvm-elf`),
        # see docker/Dockerfile.guest. Host `cargo build --release` builds native host libraries/binaries.
        run: |
          cargo build --release -p mosoo-core -p mosoo-guest -p mosoo-cli

      - name: Validate SPEL Interface Conformance (Offline Sequencer Harness)
        run: |
          cargo test -p mosoo-core --test lez_v04_acceptance_tests

      - name: Package Logos Module Artifacts
        run: |
          mkdir -p dist/module
          cp docs/SPEL_IDL.md dist/module/INTERFACE.md
          cp target/release/libmosoo_core.rlib dist/module/ 2>/dev/null || true
          tar -czvf mosoo-lez-module.tar.gz -C dist/module .
          tar -czvf mosoo-cli-linux-x86_64.tar.gz -C target/release mosoo

      - name: Check Catalog Secret Availability
        run: |
          if [ -n "${{ secrets.LOGOS_MODULE_CATALOG_TOKEN }}" ]; then
            echo "HAS_TOKEN=true" >> $GITHUB_ENV
          else
            echo "HAS_TOKEN=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Mosoo v0.4.0 Pre-Release — Offline LEZ v0.4-Target Conformance Prototype"
          body_path: CHANGELOG.md
          draft: false
          prerelease: true
          files: |
            mosoo-lez-module.tar.gz
            mosoo-cli-linux-x86_64.tar.gz
            evidence/sequencer-harness-v04/run.tsv
            evidence/verify_all_output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to Logos Module Catalog (Milestone M4)
        if: env.HAS_TOKEN == 'true' || github.event.inputs.dry_run == 'true'
        uses: logos-co/logos-modules-release-action@v1
        with:
          module-id: 'mosoo-ethereum-state-attestation'
          manifest-path: 'docs/SPEL_IDL.md'
          archive-path: 'mosoo-lez-module.tar.gz'
          version: ${{ github.ref_name }}
          api-token: ${{ secrets.LOGOS_MODULE_CATALOG_TOKEN }}
          dry-run: ${{ env.HAS_TOKEN != 'true' || github.event.inputs.dry_run == 'true' }}
