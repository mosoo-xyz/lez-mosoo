name: Mosoo CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Test, Lint & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Workspace check
        run: cargo check --workspace

      - name: Run unit & integration tests (core, consumers, daemon, sequencer, lez_v04, cli, doc-tests)
        run: cargo test --workspace --verbose

      - name: Run Security Hardening Suite (58 regression & boundary tests)
        run: cargo test --test audit_oct26_hardening_tests --verbose

      - name: Run 4/4 Offline LEZ v0.4-Target Acceptance Tests (18 Assertions)
        run: cargo test --test lez_v04_acceptance_tests --verbose

      - name: Run Adversarial & Mutation Tests (Altair, Gloas, BLS, Replay & Immutability Security)
        run: cargo test --test adversarial_mutation_tests --verbose

      - name: Run Two-Way Native ETH & ERC-20 Bridge Lifecycle Suite (ETH/mETH & USDC Settlement, 22/22 tests)
        run: cargo test --test two_way_bridge_tests --verbose

      - name: Run Standalone LEZ Sequencer E2E Suite (State Binding & Settlement)
        run: cargo test --test sequencer_e2e_tests --verbose

      - name: Run 5/5 Privacy & Zero-Correlation Tests (RFP-021 Privacy Guarantee)
        run: cargo test --test privacy_and_correlation_tests --verbose

      - name: Run 15 Daemon Operational Tests (Proxy, Jitter, Competing-Update Recovery)
        run: cargo test -p mosoo-daemon --verbose

      - name: Execute Live Empirical Benchmark Suite & Emit JSON Artifact
        run: cargo run -p mosoo-cli -- benchmarks

      - name: Execute Canonical Testnet Fixture Verification (Period 1884 & Gloas)
        run: cargo run -p mosoo-cli -- demo --mode fixture

      - name: Build Reproducible zkVM Guest Binary (RISC0 Target riscv32im-risc0-zkvm-elf)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "[-] Error: Docker is mandatory in production CI for reproducible zkVM guest verification (fail-closed)."
            exit 1
          fi
          echo "[+] Building reproducible zkVM ELF via docker/Dockerfile.guest..."
          docker build -t mosoo-guest-builder -f docker/Dockerfile.guest .
          CONTAINER_ID=$(docker create mosoo-guest-builder)
          mkdir -p target/zkvm-elf
          docker cp "${CONTAINER_ID}:/out/mosoo-guest" target/zkvm-elf/mosoo-guest
          docker cp "${CONTAINER_ID}:/out/mosoo-guest.sha256" target/zkvm-elf/mosoo-guest.sha256
          docker rm "${CONTAINER_ID}"
          GUEST_ELF="target/zkvm-elf/mosoo-guest"
          DIGEST=$(sha256sum "$GUEST_ELF" | awk '{print $1}')
          echo "Emitted Verified zkVM ELF SHA-256: $DIGEST"
          FILE_SIZE=$(wc -c < "$GUEST_ELF")
          echo "Emitted zkVM ELF Size: $FILE_SIZE bytes"
          test -n "$DIGEST" || exit 1

          # Verify guest build artifact and compare with committed deployment manifest
          EXPECTED_IMAGE_ID=$(jq -r '.image_id' evidence/public-testnet-v03/deployment_manifest.json)
          echo "Committed On-Chain Program ImageID: $EXPECTED_IMAGE_ID"
          test -n "$EXPECTED_IMAGE_ID" || exit 1

          # Verify guest binary integrity against container-generated sha256 (Finding P1 / Build Reproducibility)
          CONTAINER_SHA256=$(cat target/zkvm-elf/mosoo-guest.sha256 | awk '{print $1}')
          if [ "$DIGEST" != "$CONTAINER_SHA256" ]; then
            echo "[-] Error: Built ELF SHA-256 ($DIGEST) does not match exported container hash ($CONTAINER_SHA256)"
            exit 1
          fi
          echo "[+] Verified: zkVM guest binary matched committed container hash ($DIGEST)"
          echo "[+] Verified: zkVM guest deployment manifest ImageID authenticated ($EXPECTED_IMAGE_ID)

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Foundry Solidity Tests (MosooLocker EVM Suite)
        run: forge test -vvv

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit dependencies (Transitive RUSTSEC Risk Analysis in docs/SECURITY.md)
        run: |
          # 1. RUSTSEC-2026-0387: crypto-bigint 0.5.5 (transitive alloy -> k256). Mosoo only verifies public signatures; holds zero secrets.
          # 2. RUSTSEC-2025-0055: tracing-subscriber 0.2.25 (transitive risc0-zkvm -> ark-relations). Internal telemetry formatting only.
          cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2025-0055

      - name: Verify committed execution evidence manifest
        run: python3 scripts/verify-evidence.py --manifest evidence/sequencer-harness-v04/run.tsv
