name: Mosoo CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Test, Lint & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Workspace check
        run: cargo check --workspace

      - name: Run unit & integration tests (core, consumers, daemon, sequencer, lez_v04, cli, doc-tests)
        run: cargo test --workspace --verbose

      - name: Run Security Hardening Suite (58 regression & boundary tests)
        run: cargo test --test security_hardening_tests --verbose

      - name: Run 4/4 Offline LEZ v0.4-Target Conformance Tests (Harness)
        run: cargo test --test lez_v04_acceptance_tests --verbose

      - name: Run Adversarial & Mutation Tests (50 tests, 42 attack vectors)
        run: cargo test --test adversarial_mutation_tests --verbose

      - name: Run Two-Way Native ETH & ERC-20 Bridge Lifecycle Suite (23/23 tests)
        run: cargo test --test two_way_bridge_tests --verbose

      - name: Run Standalone LEZ Sequencer E2E Suite (4/4 tests)
        run: cargo test --test sequencer_e2e_tests --verbose

      - name: Run Real Ethereum Beacon Chain Vector Tests (Sepolia Gloas & Hoodi Fulu, 4/4 tests)
        run: cargo test --test real_chain_vectors_tests --verbose

      - name: Run 6/6 Privacy & Zero-Correlation Tests
        run: cargo test --test privacy_and_correlation_tests --verbose

      - name: Run 17 Daemon Operational Tests (Beacon Parsing, Jitter, Competing-Update Recovery)
        run: cargo test -p mosoo-daemon --verbose

      - name: Execute Live Empirical Benchmark Suite & Emit JSON Artifact
        run: cargo run -p mosoo-cli -- benchmarks

      - name: Execute Canonical Testnet Fixture Verification (Period 1884 & Gloas)
        run: cargo run -p mosoo-cli -- demo --mode fixture

      - name: Build Reproducible zkVM Guest Binary (RISC0 Target riscv32im-risc0-zkvm-elf)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "[-] Error: Docker is mandatory in production CI for reproducible zkVM guest verification (fail-closed)."
            exit 1
          fi
          echo "[+] Building reproducible zkVM ELF via docker/Dockerfile.guest..."
          docker build --build-arg GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" -t mosoo-guest-builder -f docker/Dockerfile.guest .
          CONTAINER_ID=$(docker create mosoo-guest-builder)
          mkdir -p target/zkvm-elf
          docker cp "${CONTAINER_ID}:/out/mosoo-guest" target/zkvm-elf/mosoo-guest
          docker cp "${CONTAINER_ID}:/out/mosoo-guest.sha256" target/zkvm-elf/mosoo-guest.sha256
          docker rm "${CONTAINER_ID}"
          GUEST_ELF="target/zkvm-elf/mosoo-guest"
          DIGEST=$(sha256sum "$GUEST_ELF" | awk '{print $1}')
          echo "Emitted Verified zkVM ELF SHA-256: $DIGEST"
          FILE_SIZE=$(wc -c < "$GUEST_ELF")
          echo "Emitted zkVM ELF Size: $FILE_SIZE bytes"
          test -n "$DIGEST" || exit 1

          # Verify guest binary integrity against container-generated sha256 (Build Reproducibility)
          # Note: Public LEZ v0.4 testnet is unreleased upstream; Mosoo's live LEZ v0.3.1
          # program (`mosoo_lc`) is deployed under `evidence/mosoo-testnet-v03/` while
          # `mosoo-guest` awaits public LEZ v0.4 network launch.
          CONTAINER_SHA256=$(cat target/zkvm-elf/mosoo-guest.sha256 | awk '{print $1}')
          if [ "$DIGEST" != "$CONTAINER_SHA256" ]; then
            echo "[-] Error: Built ELF SHA-256 ($DIGEST) does not match exported container hash ($CONTAINER_SHA256)"
            exit 1
          fi
          echo "[+] Verified: Built Mosoo zkVM guest ELF matches container sha256 ($DIGEST)"
          echo "[+] Diagnostic: Artifact archived for deterministic verification ahead of LEZ v0.4 deployment"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Foundry Solidity Tests (MosooLocker EVM Suite)
        run: forge test -vvv

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit dependencies (Transitive RUSTSEC Risk Analysis in docs/security-review.md)
        run: |
          # 1. RUSTSEC-2026-0387: crypto-bigint 0.5.5 (transitive alloy -> k256). Mosoo only verifies public signatures; holds zero secrets.
          # 2. RUSTSEC-2025-0055: tracing-subscriber 0.2.25 (transitive risc0-zkvm -> ark-relations). Internal telemetry formatting only.
          cargo audit --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2025-0055

      - name: Verify committed execution evidence manifest and run tamper-detection mutation suites
        run: |
          python3 scripts/verify-evidence.py --manifest evidence/sequencer-harness-v04/run.tsv
          python3 scripts/test-evidence-mutation.py
